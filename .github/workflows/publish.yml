name: Publish packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: node plugins/plainspoken/test/run.mjs
      - run: node plugins/ats-resume/test/run.mjs

      # pagecheck skips its 11 browser tests silently without Playwright, so a
      # green 10 is not a green 21. Installed once here rather than in every
      # matrix job: four parallel apt-get runs fight over the same lock.
      - name: pagecheck (with a browser)
        run: |
          npm i --no-save playwright
          npx playwright install chromium
          node plugins/pagecheck/test/run.mjs

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # One npm package per directory. The root is the `craftkit` CLI.
      matrix:
        pkg: ['.', 'plugins/plainspoken', 'plugins/pagecheck', 'plugins/ats-resume']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify package contents
        working-directory: ${{ matrix.pkg }}
        run: npm pack --dry-run

      - id: check
        name: Check if this version is already on npm
        working-directory: ${{ matrix.pkg }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published, skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $NAME@$VERSION"
          fi

      # Trusted Publishing: OIDC via the id-token permission, no NPM_TOKEN.
      # Provenance is attached automatically. Requires a trusted publisher
      # configured on npmjs.com for this repo + publish.yml, per package.
      - name: Publish
        if: steps.check.outputs.skip == 'false'
        working-directory: ${{ matrix.pkg }}
        run: npm publish --access public

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: tag
        name: Has this version already been released?
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.version }} is already tagged, skipping the release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: false
